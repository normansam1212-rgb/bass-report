<!--
  Bass Report — Pin / GPS Icon Set
  Usage: copy any <svg> below into your IC registry or inline it directly.
  All icons use viewBox="0 0 24 24", stroke="currentColor", stroke-width="2",
  stroke-linecap="round", stroke-linejoin="round", fill="none" unless noted.
  Set color via CSS `color: var(--accent)` or inline.
-->

<!-- 1. MAP PIN (solid + outline) — main location marker -->
<!-- Solid fill variant (for map markers, active states) -->
<svg viewBox="0 0 24 24" width="24" height="24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z" fill="#00e676" opacity=".15" stroke="#00e676" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="12" cy="9" r="2.5" stroke="#00e676" stroke-width="2"/>
</svg>

<!-- Outline variant (for buttons, nav) -->
<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg">
  <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/>
  <circle cx="12" cy="9" r="2.5"/>
</svg>

<!-- 2. GPS / CROSSHAIRS — "Use GPS location" button -->
<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg">
  <circle cx="12" cy="12" r="3"/>
  <circle cx="12" cy="12" r="8"/>
  <line x1="12" y1="2" x2="12" y2="6"/>
  <line x1="12" y1="18" x2="12" y2="22"/>
  <line x1="2" y1="12" x2="6" y2="12"/>
  <line x1="18" y1="12" x2="22" y2="12"/>
</svg>

<!-- 3. LOCATION PILL — horizontal badge with pin -->
<!-- Inline HTML + CSS example:
  <div class="loc-pill">
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/>
      <circle cx="12" cy="9" r="2.5"/>
    </svg>
    <span>Dallas, TX</span>
  </div>
  CSS:
  .loc-pill {
    display: inline-flex; align-items: center; gap: 6px;
    background: rgba(0,230,118,.10); border: 1px solid rgba(0,230,118,.25);
    border-radius: 20px; padding: 4px 12px 4px 8px;
    color: #00e676; font-size: 13px; font-weight: 600;
  }
-->

<!-- 4. NEARBY / RANKING PIN — pin with number badge -->
<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg">
  <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/>
  <circle cx="12" cy="9" r="2.5"/>
  <circle cx="18" cy="4" r="4" fill="#080e18" stroke="#00e676" stroke-width="1.5"/>
  <text x="18" y="5.5" text-anchor="middle" fill="#00e676" stroke="none" font-size="6" font-weight="700">1</text>
</svg>

<!-- 5. GPS PULSE — animated location pulse (for "locating..." state) -->
<!-- Add CSS: @keyframes gps-pulse { 0%{r:3;opacity:.8} 100%{r:10;opacity:0} }
     <circle class="gps-pulse-ring" cx="12" cy="12" r="3"/>
-->
<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg">
  <circle cx="12" cy="12" r="3" fill="currentColor" opacity=".4"/>
  <circle cx="12" cy="12" r="7" opacity=".3"/>
  <circle cx="12" cy="12" r="11" opacity=".1"/>
</svg>

<!-- 6. NARROW PIN — compact pin for list rows / ranking items -->
<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg">
  <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/>
  <circle cx="12" cy="9" r="2"/>
</svg>
